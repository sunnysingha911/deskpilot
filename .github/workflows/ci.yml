name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web app (React + Vite) and the Swift helpers: macOS, since the helpers control macOS.
  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm run build:native

  # The backend: lint, strict types, unit + integration + API contract tests against a real Postgres.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deskpilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deskpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskpilot -d deskpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DESKPILOT_TEST_DATABASE_URL: postgresql+asyncpg://deskpilot:ci-only-password@127.0.0.1:5432/deskpilot_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
      # Node only for the web-app parity check (tests/unit/test_ui_parity.py runs ui/src/lib/schema.ts).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: uv sync --frozen --extra runner
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: deskpilot-api:ci
